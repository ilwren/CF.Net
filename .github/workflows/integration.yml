name: Integration

# Runs the tests that talk to the real Cloudflare API.
#
# It is NOT triggered by push or pull_request on purpose: those runs have no credentials, and a
# schedule/dispatch-only workflow keeps untrusted forks from being able to spend your API quota or
# touch your account.
#
# The cadence that follows from it: new endpoints are proven by the offline unit tests on every push
# (ci.yml), and the live suite is run once per phase - dispatch it by hand when a batch of endpoints is
# finished, or let the Monday schedule do it.
#
# TEMPORARY EXCEPTION to that, and the cause is a GitHub rule rather than anything in this file:
# workflow_dispatch and schedule only fire for a workflow that exists on the DEFAULT branch, and this one
# lives on arena/5d11f1dd-cf-net until PR #1 is merged. So the Actions page shows no "Run workflow" button
# and the Monday cron has never fired. Until the merge, a push trigger scoped to that one branch is how a
# live run gets made. It stays read-only - a push event carries no dispatch inputs, so
# CLOUDFLARE_IT_ENABLE_WRITES resolves to 'false' and every write test skips with a reason. Delete the
# push trigger, and only it, once the branch is merged.
#
# To make it do anything, add these repository secrets
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   CLOUDFLARE_API_TOKEN      required  - API token scoped to the resources you want to exercise
#   CLOUDFLARE_ACCOUNT_ID     required  - for Workers, Pages, D1, KV and R2
#   CLOUDFLARE_ZONE_ID        required  - for the DNS record and cache purge tests
#   CLOUDFLARE_API_EMAIL      optional  - only for the legacy global-key path
#   CLOUDFLARE_GLOBAL_API_KEY optional  - only for the legacy global-key path
#
# Without them the job reports a warning and the tests skip themselves instead of failing.
# See docs/integration-testing.md for how to create a correctly scoped token.

on:
  workflow_dispatch:
    inputs:
      enable_writes:
        description: 'Allow tests that create and delete resources (KV namespace, R2 bucket, D1 database, Worker, Pages project, DNS record, cache purge)'
        type: boolean
        default: false
      cassette:
        description: 'Record every call into tests/cassettes/<name>.json, for the offline unit tests to replay (leave empty to disable recording)'
        type: string
        default: ''
      commit_cassette:
        description: 'Commit the recorded cassette back to this branch'
        type: boolean
        default: false
      filter:
        description: "Narrow the run, e.g. FullyQualifiedName~R2 (always combined with Category=Integration)"
        type: string
        default: ''
  schedule:
    # Mondays at 04:00 UTC - read-only, so it can run unattended.
    - cron: '0 4 * * 1'
  # TEMPORARY - see the header. Remove once this workflow is on the default branch.
  push:
    branches:
      - arena/5d11f1dd-cf-net

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # Injected from repository secrets. GitHub masks secret values in every log line automatically.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_API_EMAIL: ${{ secrets.CLOUDFLARE_API_EMAIL }}
  CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
  CLOUDFLARE_IT_ENABLE_WRITES: ${{ (github.event.inputs.enable_writes == true || github.event.inputs.enable_writes == 'true') && 'true' || 'false' }}
  # Recording is off unless a cassette name is given. CLOUDFLARE_IT_RECORD only means something
  # together with CLOUDFLARE_IT_CASSETTE.
  CLOUDFLARE_IT_CASSETTE: ${{ github.event.inputs.cassette || '' }}
  CLOUDFLARE_IT_RECORD: ${{ github.event.inputs.cassette && 'true' || 'false' }}

jobs:
  integration:
    name: Cloudflare API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only used by the opt-in "commit the cassette" step

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Report which credential scheme is available
        id: credentials
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "scheme=API token" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Using CLOUDFLARE_API_TOKEN."
          elif [ -n "${CLOUDFLARE_GLOBAL_API_KEY:-}" ] && [ -n "${CLOUDFLARE_API_EMAIL:-}" ]; then
            echo "scheme=Global API key" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Using CLOUDFLARE_GLOBAL_API_KEY with CLOUDFLARE_API_EMAIL."
          else
            echo "scheme=none" >> "$GITHUB_OUTPUT"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Cloudflare credentials are configured. Add CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_ZONE_ID) as repository secrets - see docs/integration-testing.md."
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID is not set; Workers, Pages, D1, KV and R2 tests will skip. It is 32 hexadecimal characters - any domain's Overview page in the API section, or Ctrl/Cmd+K then 'Copy account ID'. Not the account name, not a dashboard URL."
          fi
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID is not set; DNS and cache purge tests will skip. It is 32 hexadecimal characters - that domain's Overview page, in the API section next to Zone ID. The token also needs the zone in its Zone Resources."
          fi
          if [ "${CLOUDFLARE_ACCOUNT_ID:-}" != "" ] || [ "${CLOUDFLARE_ZONE_ID:-}" != "" ]; then
            # Shape checking lives in the fixture (CFNet.TestKit.CredentialFormat), which reports a
            # malformed value by name to the test output and to the run report this job summarises.
            echo "Credential shapes are checked by the tests themselves; a wrong one is named in the summary."
          fi

          echo "Write operations: ${CLOUDFLARE_IT_ENABLE_WRITES}"

          if [ -n "${CLOUDFLARE_IT_CASSETTE:-}" ]; then
            echo "::notice::Recording this run into tests/cassettes/${CLOUDFLARE_IT_CASSETTE}.json. Credentials are redacted on the way in."
          fi

      - name: Verify the credentials against the live API
        id: verify
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -o pipefail
          PY=$(command -v python3 || command -v python || true)
          if [ -z "$PY" ]; then echo "no python"; exit 0; fi

          base="${CLOUDFLARE_BASE_ADDRESS:-https://api.cloudflare.com/client/v4}"
          base="${base%/}"

          # Describe the shapes first. Cloudflare answers both "this was pasted wrong" and "this token
          # was revoked" with the same 1000 Invalid API Token, and shape is the half of that question a
          # log can answer - without printing any part of a secret beyond its length and its kind.
          "$PY" - <<'PY'
          import os

          known = (
              ('cfut_', 'a user API token'),
              ('cfat_', 'an account-owned API token'),
              ('cfk_', 'a Global API Key'),
          )

          def describe(name, value):
              if not value:
                  print(f'::notice::{name} is not set.')
                  return
              trimmed = value.strip()
              problems = []
              if value != trimmed:
                  problems.append('surrounding whitespace')
              if len(trimmed) > 1 and trimmed[0] == trimmed[-1] and trimmed[0] in ('"', chr(39)):
                  problems.append('surrounding quotes')
              kind = next((label for prefix, label in known if trimmed.startswith(prefix)),
                          'no recognised cfut_/cfat_/cfk_ prefix (a pre-2026 credential, or the wrong value)')
              note = ' - PROBLEM: ' + ' and '.join(problems) if problems else ''
              print(f'::notice::{name}: {len(trimmed)} characters, {kind}{note}.')

          describe('CLOUDFLARE_API_TOKEN', os.environ.get('CLOUDFLARE_API_TOKEN'))
          describe('CLOUDFLARE_GLOBAL_API_KEY', os.environ.get('CLOUDFLARE_GLOBAL_API_KEY'))

          for name in ('CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_ZONE_ID'):
              value = (os.environ.get(name) or '').strip()
              hexish = len(value) == 32 and all(c in '0123456789abcdefABCDEF' for c in value)
              verdict = 'a 32-character hexadecimal id' if hexish else \
                  f'{len(value)} characters, which is NOT a 32-character hexadecimal id'
              print(f'::notice::{name}: {verdict}.')
          PY

          # Then ask Cloudflare. An account-owned token (cfat_) is verified under the account, so both
          # endpoints are tried and the answer says which accepted it - which also tells the suite
          # whether the user-scoped verify endpoint can work with this token at all.
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            user_url="$base/user/tokens/verify"
          else
            auth=(-H "X-Auth-Key: ${CLOUDFLARE_GLOBAL_API_KEY}" -H "X-Auth-Email: ${CLOUDFLARE_API_EMAIL}")
            user_url="$base/user"
          fi

          curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/verify-user.json" \
            "$user_url" "${auth[@]}" || true
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/verify-account.json" \
              "$base/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" "${auth[@]}" || true
          fi

          "$PY" - "$RUNNER_TEMP/verify-user.json" "$RUNNER_TEMP/verify-account.json" "$user_url" <<'PY'
          import json, os, sys

          user_body, account_body, user_url = sys.argv[1], sys.argv[2], sys.argv[3]

          def read(path):
              try:
                  with open(path, encoding='utf-8') as handle:
                      return json.load(handle)
              except Exception:
                  return None

          def rendered(payload):
              if payload is None:
                  return 'no parsable response (was the endpoint reachable?)'
              errors = payload.get('errors') or []
              return ', '.join(f"{e.get('code')}: {e.get('message')}" for e in errors) or 'no error detail was returned'

          user_payload = read(user_body)
          account_payload = read(account_body) if os.path.exists(account_body) else None

          if user_payload and user_payload.get('success'):
              status = (user_payload.get('result') or {}).get('status')
              suffix = f' (token status: {status})' if status else ''
              print(f'::notice::Cloudflare accepted these credentials at {user_url}{suffix}.')
              sys.exit(0)

          if account_payload and account_payload.get('success'):
              status = (account_payload.get('result') or {}).get('status')
              suffix = f' (token status: {status})' if status else ''
              print(f'::notice::Cloudflare accepted these credentials at the account-scoped verify endpoint{suffix}.')
              print('::warning::This is an account-owned token, so GET /user/tokens/verify rejects it. The A_token_can_be_verified_directly test uses that endpoint and will fail; every other call in the suite is unaffected.')
              sys.exit(0)

          print('::error::Cloudflare rejected these credentials.')
          print(f'::error::  {user_url} -> {rendered(user_payload)}')
          if account_payload is not None:
              print(f'::error::  accounts/{{account_id}}/tokens/verify -> {rendered(account_payload)}')
          print('::error::Usual causes, most common first: the secret was saved with quotes or a trailing newline; the value is a token id, an account id or a dashboard URL rather than the secret; the token was rolled or revoked after it was saved; or it is account-owned (cfat_) and only the account-scoped endpoint accepts it.')
          sys.exit(1)
          PY

      - name: Check what the credentials can actually reach
        if: steps.credentials.outputs.available == 'true'
        # A diagnostic must never be the reason the suite reports failure: if this step's own curl or
        # python misbehaves, the tests still have to run and still have to be believed.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          base="${CLOUDFLARE_BASE_ADDRESS:-https://api.cloudflare.com/client/v4}"
          base="${base%/}"

          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          else
            auth=(-H "X-Auth-Key: ${CLOUDFLARE_GLOBAL_API_KEY}" -H "X-Auth-Email: ${CLOUDFLARE_API_EMAIL}")
          fi

          # One read-only call per product area. A token can be perfectly valid and still see nothing -
          # that is the failure mode that produced a green run in which every zone-scoped test skipped -
          # so each area is asked directly and named here, rather than the gap being inferred from the
          # test summary afterwards.
          probe() {
            label="$1"
            url="$2"
            method="${3:-GET}"
            body="${4:-}"
            args=(--silent --show-error --max-time 30 --request "$method"
                  --output "$RUNNER_TEMP/reach-$label.json" --write-out '%{http_code}' "$url" "${auth[@]}")
            if [ -n "$body" ]; then
              args+=(-H "Content-Type: application/json" --data "$body")
            fi
            code=$(curl "${args[@]}" || echo 000)
            echo "$code" > "$RUNNER_TEMP/reach-$label.status"
          }

          probe zones "$base/zones?per_page=1"

          if [ -n "${CLOUDFLARE_ZONE_ID:-}" ]; then
            zone="$base/zones/${CLOUDFLARE_ZONE_ID}"
            probe zone "$zone"
            probe dns "$zone/dns_records?per_page=1"
            probe dnssec "$zone/dnssec"
            probe dnssec_zsk "$zone/dnssec/zsk"
            probe settings "$zone/settings"
            probe ssl "$zone/ssl/certificate_packs?per_page=1"
            probe custom_hostnames "$zone/custom_hostnames?per_page=1"
            probe origin_tls "$zone/origin_tls_client_auth/settings"
            # An empty body is refused before anything is purged, so this reads the permission without
            # touching the cache: 403 means Cache Purge is missing, a validation error means it is there.
            probe cache_purge "$zone/purge_cache" POST '{}'
          fi

          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            account="$base/accounts/${CLOUDFLARE_ACCOUNT_ID}"
            probe account "$account"
            probe workers_scripts "$account/workers/scripts?per_page=1"
            probe workers_domains "$account/workers/domains"
            probe pages "$account/pages/projects"
            probe d1 "$account/d1/database?per_page=1"
            probe kv "$account/storage/kv/namespaces?per_page=1"
            probe r2 "$account/r2/buckets?per_page=1"
          fi

          PY=$(command -v python3 || command -v python || true)
          if [ -z "$PY" ]; then echo "no python"; exit 0; fi
          "$PY" - <<'PY'
          import json, os, urllib.parse

          temp = os.environ.get('RUNNER_TEMP', '.')

          # label -> (endpoint, dashboard permission, template key, template type).
          # The keys are Cloudflare's own: note that Pages is 'page' and R2 is 'workers_r2', neither of
          # which is what the dashboard label suggests.
          AREAS = [
              ('zones',            'GET /zones',                              'Zone - Read',              'zone',                 'read'),
              ('zone',             'GET /zones/{zone_id}',                    'Zone - Read',              'zone',                 'read'),
              ('dns',              'GET /zones/{zone_id}/dns_records',        'DNS - Read',               'dns',                  'read'),
              ('dnssec',           'GET /zones/{zone_id}/dnssec',             'DNS - Read',               'dns',                  'read'),
              ('dnssec_zsk',       'GET /zones/{zone_id}/dnssec/zsk',         'DNS - Read',               'dns',                  'read'),
              ('settings',         'GET /zones/{zone_id}/settings',           'Zone Settings - Read',     'zone_settings',        'read'),
              ('ssl',              'GET /zones/{zone_id}/ssl/certificate_packs', 'SSL and Certificates - Read', 'ssl_and_certificates', 'read'),
              ('custom_hostnames', 'GET /zones/{zone_id}/custom_hostnames',   'SSL and Certificates - Read', 'ssl_and_certificates', 'read'),
              ('origin_tls',       'GET /zones/{zone_id}/origin_tls_client_auth/settings', 'SSL and Certificates - Read', 'ssl_and_certificates', 'read'),
              ('cache_purge',      'POST /zones/{zone_id}/purge_cache',       'Cache Purge - Purge',      'cache',                'purge'),
              ('account',          'GET /accounts/{account_id}',              'Account Settings - Read',  'account_settings',     'read'),
              ('workers_scripts',  'GET /accounts/{account_id}/workers/scripts', 'Workers Scripts - Read', 'workers_scripts',      'read'),
              ('workers_domains',  'GET /accounts/{account_id}/workers/domains', 'Workers Scripts - Read', 'workers_scripts',      'read'),
              ('pages',            'GET /accounts/{account_id}/pages/projects', 'Pages - Read',           'page',                 'read'),
              ('d1',               'GET /accounts/{account_id}/d1/database',  'D1 - Read',                'd1',                   'read'),
              ('kv',               'GET /accounts/{account_id}/storage/kv/namespaces', 'Workers KV Storage - Read', 'workers_kv_storage', 'read'),
              ('r2',               'GET /accounts/{account_id}/r2/buckets',   'Workers R2 Storage - Read', 'workers_r2',           'read'),
          ]

          # The write tests need these on top, as Edit rather than Read.
          WRITE_LEVELS = {
              'zone': 'edit', 'dns': 'edit', 'zone_settings': 'edit', 'ssl_and_certificates': 'edit',
              'workers_scripts': 'edit', 'page': 'edit', 'd1': 'edit', 'workers_kv_storage': 'edit',
              'workers_r2': 'edit', 'cache': 'purge',
          }

          def read(label):
              status_file = os.path.join(temp, f'reach-{label}.status')
              if not os.path.exists(status_file):
                  return None, None
              with open(status_file, encoding='utf-8') as handle:
                  status = handle.read().strip()
              try:
                  with open(os.path.join(temp, f'reach-{label}.json'), encoding='utf-8') as handle:
                      return status, json.load(handle)
              except Exception:
                  return status, None

          def detail(payload):
              if not payload:
                  return ''
              errors = payload.get('errors') or []
              return '; '.join(f"{e.get('code')}: {e.get('message')}" for e in errors)[:160]

          rows = []
          missing = []
          empty_zone_list = False

          for label, endpoint, group, key, ptype in AREAS:
              status, payload = read(label)
              if status is None:
                  continue

              # Cache purge is probed with a body Cloudflare refuses, so a validation error is the good
              # answer: it means the permission is there and nothing was purged.
              if label == 'cache_purge' and status not in ('200', '403', '404'):
                  rows.append((endpoint, group, status, 'permission present - the empty body was refused, nothing was purged'))
                  continue

              if status == '200':
                  if label == 'zones' and not ((payload or {}).get('result') or []):
                      empty_zone_list = True
                      rows.append((endpoint, group, status, 'OK but returned NO ZONES'))
                  else:
                      rows.append((endpoint, group, status, 'readable'))
              elif status == '403':
                  rows.append((endpoint, group, status, 'FORBIDDEN - ' + (detail(payload) or 'no error detail')))
                  if label != 'r2':
                      missing.append((group, key, ptype))
              elif status == '404':
                  rows.append((endpoint, group, status, 'not found - a wrong id or an absent resource, not a permission'))
              else:
                  rows.append((endpoint, group, status, detail(payload) or 'unexpected'))

          lines = ['### What these credentials can reach', '',
                   '| Endpoint | Permission it needs | HTTP | Verdict |', '| --- | --- | ---: | --- |']
          for endpoint, group, status, verdict in rows:
              lines.append(f'| `{endpoint}` | {group} | {status} | {verdict} |')
          lines.append('')

          if empty_zone_list:
              lines += [
                  '**`GET /zones` succeeded but returned no zones.** The token authenticates and can see '
                  'nothing zone-scoped, so DNS records, DNSSEC, zone settings, SSL, custom hostnames, '
                  'origin TLS client auth and cache purge will all skip. Edit the token and, under **Zone '
                  'Resources**, include the zone in `CLOUDFLARE_ZONE_ID` (or *All zones*) - permissions '
                  'alone are not enough, the zone has to be in scope.', '']

          if missing:
              wanted = []
              for group, key, ptype in missing:
                  if (group, key, ptype) not in wanted:
                      wanted.append((group, key, ptype))
              lines += ['**Missing:** ' + ', '.join(f'{group} (`{{"key":"{key}","type":"{ptype}"}}`)'
                                                    for group, key, ptype in wanted), '']

          def encode(permissions):
              return urllib.parse.quote(
                  json.dumps([{'key': key, 'type': ptype} for key, ptype in permissions],
                             separators=(',', ':')),
                  safe='')

          read_only = [(key, ptype) for _, _, _, key, ptype in AREAS]
          # The verify step before this one calls accounts/{account_id}/tokens/verify, which has no probe
          # of its own here - a token built from the URLs below still has to be able to answer it.
          read_only.append(('account_api_tokens', 'read'))
          seen = []
          for entry in read_only:
              if entry not in seen:
                  seen.append(entry)
          full = [(key, WRITE_LEVELS.get(key, ptype)) for key, ptype in seen]
          name = urllib.parse.quote('CF.Net integration')

          account_full = ('https://dash.cloudflare.com/?to=/:account/api-tokens'
                          f'&permissionGroupKeys={encode(full)}&name={name}')
          account_read = ('https://dash.cloudflare.com/?to=/:account/api-tokens'
                          f'&permissionGroupKeys={encode(seen)}&name={name}')
          # The account-token base already carries a '?', the profile one does not - forgetting it here
          # produces a URL that opens a 404 instead of the token form.
          user_full = ('https://dash.cloudflare.com/profile/api-tokens?'
                       f'permissionGroupKeys={encode(full)}&accountId=%2A&zoneId=all&name={name}')

          lines += [
              '#### Create the token without ticking boxes',
              '',
              'Cloudflare pre-fills the token form from a URL. Each of these carries the whole permission '
              'set; you still choose the account and, for an account-owned token, the **Zone Resources** in '
              'the form itself.',
              '',
              f'- Account-owned (`cfat_`), **full suite including writes**: {account_full}',
              f'- Account-owned (`cfat_`), **read-only** (all the Monday schedule needs): {account_read}',
              f'- User-owned (`cfut_`), full suite - also makes `GET /user/tokens/verify` work, which an '
              f'account-owned token can never answer: {user_full}',
              '',
              'Keys are Cloudflare\'s own and two of them do not match their dashboard labels: Pages is '
              '`page`, R2 is `workers_r2`. R2 also has to be enabled on the account separately, so a 403 '
              'there is reported as a notice rather than a missing permission.',
              '',
              'The read-only URL still carries Cache Purge, because the probe above reads that permission '
              'with a body Cloudflare refuses; only the write tests actually purge anything. Drop it if you '
              'want the strict minimum.',
              '']

          text = '\n'.join(lines)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write(text + '\n')
          print(text)

          # Annotations are capped at ten per level per step, so the detail lives in the summary above and
          # only the verdict is announced here.
          readable = sum(1 for row in rows if row[3] == 'readable' or row[3].startswith('permission present'))
          if missing:
              names = ', '.join(sorted({group for group, _, _ in missing}))
              print(f'::error::{len(missing)} of {len(rows)} probe(s) were refused. Missing: {names}. '
                    'The step summary has the per-endpoint table and a token-creation URL that pre-fills '
                    'every permission this suite needs.')
          else:
              print(f'::notice::{readable} of {len(rows)} probe(s) answered; nothing was refused. '
                    'Every product area this suite reads is in scope.')
          r2_status, _ = read('r2')
          if r2_status == '403':
              print('::notice::R2 answered 403 and is deliberately not counted as missing: either the token '
                    'lacks Workers R2 Storage - Read, or R2 is not enabled on this account, which is a '
                    'one-time dashboard step. The R2 tests skip with a reason either way.')
          if empty_zone_list:
              print('::error::GET /zones returned no zones: add the zone to the token\'s Zone Resources, '
                    'or the zone belongs to a different account than CLOUDFLARE_ACCOUNT_ID and an '
                    'account-owned token will never see it.')
          PY

      - name: Restore
        run: dotnet restore tests/CF.Net.IntegrationTests/CF.Net.IntegrationTests.csproj

      - name: Run integration tests
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        env:
          # Passed through the environment rather than interpolated into the script, so a dispatch
          # input can never become shell.
          EXTRA_FILTER: ${{ github.event.inputs.filter || '' }}
        run: |
          set -o pipefail

          # Every test that ends early appends one line here and every Cloudflare call another, and
          # the "Summarise the run" step turns the file into tables. xunit v2 has no dynamic skip, so
          # without it a credential-less run would look exactly like one that talked to Cloudflare 25
          # times. It is set from the shell variable here rather than from the runner context in a
          # job-level env:, which GitHub does not allow - the whole file is rejected if you try.
          export CLOUDFLARE_IT_REPORT="${CLOUDFLARE_IT_REPORT:-$RUNNER_TEMP/integration-report.tsv}"

          filter="Category=Integration"
          if [ -n "${EXTRA_FILTER:-}" ]; then
            filter="Category=Integration&${EXTRA_FILTER}"
          fi
          echo "Filter: $filter"

          dotnet test tests/CF.Net.IntegrationTests/CF.Net.IntegrationTests.csproj \
            --configuration "$CONFIGURATION" \
            --no-restore \
            --filter "$filter" \
            --logger "trx;LogFileName=integration.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory TestResults

      - name: Skipped
        if: steps.credentials.outputs.available != 'true'
        run: echo "Integration tests skipped - no credentials. The job is green because there is nothing to verify."

      - name: Summarise the run
        if: always()
        shell: bash
        run: |
          set -o pipefail
          export CLOUDFLARE_IT_REPORT="${CLOUDFLARE_IT_REPORT:-$RUNNER_TEMP/integration-report.tsv}"
          PY=$(command -v python3 || command -v python || true)
          if [ -z "$PY" ]; then echo "no python"; exit 0; fi
          "$PY" - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}

          def cell(text):
              return (text or '').replace('|', r'\|').replace('\n', ' ')

          counts = {}
          failures = []
          total = 0
          for trx in sorted(glob.glob('TestResults/**/*.trx', recursive=True)):
              try:
                  root = ET.parse(trx).getroot()
              except Exception:
                  continue
              for result in root.findall('.//t:UnitTestResult', ns):
                  total += 1
                  outcome = result.get('outcome') or 'Unknown'
                  counts[outcome] = counts.get(outcome, 0) + 1
                  if outcome == 'Failed':
                      info = result.find('.//t:ErrorInfo', ns)
                      message = (info.findtext('t:Message', '', ns) or '').strip() if info is not None else ''
                      failures.append((result.get('testName') or '?', message))

          skipped = []
          calls = []
          report = os.environ.get('CLOUDFLARE_IT_REPORT')
          if report and os.path.exists(report):
              with open(report, encoding='utf-8') as handle:
                  for line in handle.read().splitlines():
                      fields = line.split(chr(9))
                      if len(fields) < 3:
                          continue
                      if fields[0].upper() == 'SKIPPED':
                          skipped.append((fields[1], fields[2]))
                      elif fields[0].upper() == 'INFO':
                          calls.append((fields[1], fields[2]))

          lines = ['### Cloudflare integration run', '']
          if total == 0:
              lines += ['No test results were produced. The suite never ran, which normally means no credentials were configured.', '']
          else:
              lines += ['| Outcome | Tests |', '| --- | ---: |']
              for outcome in sorted(counts):
                  lines.append(f'| {outcome} | {counts[outcome]} |')
              lines += [f'| **Total** | **{total}** |', '']

          if skipped:
              lines += [
                  f'<details open><summary>{len(skipped)} test(s) ended early without calling Cloudflare</summary>',
                  '', '| Test | Why |', '| --- | --- |']
              for test, reason in skipped:
                  lines.append(f'| `{cell(test)}` | {cell(reason)} |')
              lines += [
                  '', '</details>', '',
                  'These are reported as passing, which is why the job can be green without having verified anything.',
                  'Add the matching secret - or set the switch named in the reason - to make them run for real.', '']

          if calls:
              shown = calls[:200]
              lines += [
                  f'<details><summary>{len(calls)} Cloudflare call(s) this run made</summary>',
                  '', '| Call | Result |', '| --- | --- |']
              for call, result in shown:
                  lines.append(f'| `{cell(call)}` | {cell(result)} |')
              if len(calls) > len(shown):
                  lines.append(f'| ... and {len(calls) - len(shown)} more | |')
              lines += ['', '</details>', '']

          if failures:
              lines += [f'<details open><summary>{len(failures)} failing test(s)</summary>', '']
              for test, message in failures:
                  lines += [f'**{cell(test)}**', '', '```', (message or '(no message)')[:1200], '```', '']
              lines.append('</details>')

          # Annotations are the only per-test detail this run publishes that is readable through the
          # GitHub API without downloading the job log, so they repeat what the summary says. GitHub
          # keeps at most 10 of each level per step, so the remainder collapses into one extra line
          # rather than vanishing. A percent sign or a newline in a message would otherwise end the
          # annotation early, hence the escaping.
          def annotation(level, message):
              safe = message.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
              print('::' + level + '::' + safe)

          if total:
              tally = ', '.join(outcome + '=' + str(counts[outcome]) for outcome in sorted(counts))
              annotation('notice', 'Integration suite: ' + tally + ' (total ' + str(total) + ')')
          for test, message in failures[:9]:
              annotation('error', str(test) + ': ' + (message or '(no message)')[:400])
          if len(failures) > 9:
              annotation('error', 'and ' + str(len(failures) - 9) + ' more failing test(s), listed in the job summary')
          for test, reason in skipped[:5]:
              annotation('notice', 'SKIPPED ' + str(test) + ': ' + str(reason)[:280])
          if len(skipped) > 5:
              annotation('notice', 'and ' + str(len(skipped) - 5) + ' more skipped test(s), listed in the job summary')

          # The transcript is the only place that shows which endpoint answered what, so it goes out too -
          # chunked, because one annotation long enough to hold every call gets truncated anyway. The
          # caps above and here keep the whole step inside GitHub's 10-notices-per-step limit.
          for start in range(0, min(len(calls), 64), 16):
              chunk = calls[start:start + 16]
              joined = ' | '.join(str(call) + ' -> ' + str(result) for call, result in chunk)
              annotation('notice', 'Cloudflare calls ' + str(start + 1) + '-' + str(start + len(chunk)) + ': ' + joined[:1600])
          text = '\n'.join(lines)
          print(text)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write(text + '\n')
          PY

      - name: Show what was recorded
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.cassette != ''
        run: |
          echo "### Cassette" >> "$GITHUB_STEP_SUMMARY"
          if ls tests/cassettes/*.json >/dev/null 2>&1; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            head -c 4000 tests/cassettes/"${CLOUDFLARE_IT_CASSETTE}".json >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Exchanges recorded: $(grep -c '"pathAndQuery"' tests/cassettes/"${CLOUDFLARE_IT_CASSETTE}".json || echo 0)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing was recorded - the tests probably all skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Either download the artifact below and commit it yourself, or let the workflow do it.
      - name: Commit the cassette back to the branch
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.cassette != '' && (github.event.inputs.commit_cassette == true || github.event.inputs.commit_cassette == 'true')
        run: |
          if ! ls tests/cassettes/*.json >/dev/null 2>&1; then
            echo "No cassette file to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME"
          git add tests/cassettes
          if git diff --cached --quiet; then
            echo "The cassette is unchanged."
          else
            git commit -m "Record Cloudflare cassette '${{ github.event.inputs.cassette }}'"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload recorded cassette
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.cassette != ''
        uses: actions/upload-artifact@v7
        with:
          name: cassette-${{ github.event.inputs.cassette }}
          path: tests/cassettes/**/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 30
